name: CI

# Third-party actions are pinned to immutable commit SHAs (a retagged action cannot silently change what we run).
# Dependabot (github-actions ecosystem) keeps these SHAs current via PRs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests create their own throw-away databases on this server.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check app tests scripts migrations
      - name: Format check
        run: uv run ruff format --check app tests scripts
      - name: Type check (mypy --strict)
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Dependency vulnerability audit (hash-pinned lockfile export)
        run: |
          uv export --frozen --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (includes XSS-sink bans)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser bundle must not contain secrets or server-only names
        run: python3 ../scripts/scan_secrets.py --path .next/static --forbid-names --allow-anon-jwt
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  contract:
    name: API contract (OpenAPI ↔ generated TS types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend schema is up to date
        working-directory: backend
        run: uv sync --frozen && uv run python scripts/export_openapi.py --check
      - name: Generated TypeScript types are up to date
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts

  e2e:
    name: E2E (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoi
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No uv cache here: a single `uv sync` is cheap, and the cache-prune post step failed in this job.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create database and apply migrations
        working-directory: backend
        run: |
          uv sync --frozen
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE aoi"
          uv run alembic upgrade head
      - name: Start API
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app_factory --factory --port 8000 --no-server-header > /tmp/api.log 2>&1 &
          curl --retry 40 --retry-connrefused --retry-delay 1 -sf http://localhost:8000/readyz
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/api.log

  secret-scan:
    name: Secret scan (repo scanner + gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository scanner (tree + history + forbidden files)
        run: python3 scripts/scan_secrets.py --tree --history
      - name: Public-readiness audit (personal data, workflow safety)
        run: python3 scripts/prepublic_audit.py --tree --workflows
      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks (full git history)
        run: ./gitleaks git --redact --no-banner --verbose .
