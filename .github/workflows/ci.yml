name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests create their own throw-away databases on this server.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL_TEST: redis://localhost:6379/1
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check app tests scripts migrations
      - name: Format check
        run: uv run ruff format --check app tests scripts
      - name: Type check (mypy --strict)
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Dependency vulnerability audit
        run: >-
          uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements.txt &&
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  contract:
    name: API contract (OpenAPI ↔ generated TS types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend schema is up to date
        working-directory: backend
        run: uv sync --frozen && uv run python scripts/export_openapi.py --check
      - name: Generated TypeScript types are up to date
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts

  e2e:
    name: E2E (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoi
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create database and apply migrations
        working-directory: backend
        run: |
          uv sync --frozen
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE aoi"
          uv run alembic upgrade head
      - name: Start API
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app_factory --factory --port 8000 > /tmp/api.log 2>&1 &
          curl --retry 40 --retry-connrefused --retry-delay 1 -sf http://localhost:8000/readyz
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: API log (on failure)
        if: failure()
        run: cat /tmp/api.log

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
